[project]
name = "opencode-companion"
version = "0.4.1"
description = "Desktop companion for OpenCode models, agents, MCP servers, workspaces and settings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.8",
    "jsonschema>=4.23,<5",
]

[project.gui-scripts]
opencode-companion = "opencode_model_sync:main"
opencode-model-sync = "opencode_model_sync:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opencode_model_sync"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
